name: Deploy

# Logic lives in JonomaIT/pipelines: this file only says when to run it and the apply order.
#   pull request → plan of what changed (read-only) + PR comment; "Plan result" is a required check
#   main         → plan, ONE approval per account looking at the plans, apply of those plans
#   manual       → the same for a component, a tfvars or everything, or destroy (reverse order)
#   every night  → drift check: plan of what is deployed; changes open the "Terraform drift
#                  detected" issue, a clean night closes it; never applies
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *" # 06:00 in Brasília
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: false
        default: ""
        description: Component (e.g. network) or tfvars (e.g. network/env/production/us-east-1.tfvars); empty = everything
      destroy:
        type: boolean
        required: false
        default: false
        description: Destroy instead of apply (reverse order)

permissions:
  contents: read
  id-token: write      # OIDC with AWS
  pull-requests: write # plan comment
  issues: write        # drift issue

# Never two runs touching the same states; an apply is never interrupted halfway.
concurrency:
  group: terraform-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: JonomaIT/pipelines/.github/workflows/terraform-deploy.yml@v1.1.0
    with:
      order: >-
        network
        ecs-cluster
        alb-shared
        cross-region/network-peering
        global/cloudflare-zone
        global/dns-cloudflare
      target: ${{ inputs.target || '' }}
      destroy: ${{ inputs.destroy || false }}
      drift: ${{ github.event_name == 'schedule' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_JONOMA }}
