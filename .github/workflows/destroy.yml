name: Destroy

# Tears the lab down. Manual only, with a typed confirmation and approval through the "destroy" Environment.
# Reverse creation order: routing → ecs → network (Global Accelerator points at the ecs NLBs, and the
# load balancers and VPC Link live in the network subnets). Within each stack: post → regions → pre.
# Each option also removes everything that depends on it: ecs takes routing along, all takes everything.
# To bring it back up: Run workflow on "Infrastructure".
on:
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        description: "What to destroy: routing (Global Accelerator), ecs (routing + cluster) or all (everything)"
        options:
          - routing
          - ecs
          - all
        default: routing
      confirm:
        type: string
        required: true
        description: Type "destroy" to confirm

permissions:
  contents: read
  id-token: write # required for OIDC with AWS

# Same group as Infrastructure: never destroys while an apply is running (and vice versa).
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  check:
    name: Check confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate input and branch
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Invalid confirmation. Type exactly: destroy"
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Destroy only runs from main (got: $REF)"
            exit 1
          fi

  approve:
    name: Approve destroy (${{ inputs.stack }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: destroy # required reviewers: the job waits for approval before running
    steps:
      - name: Approved
        run: echo "Destroy of '${{ inputs.stack }}' approved by ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- routing
  routing-post:
    name: Routing post-deployment (Global Accelerator)
    needs: approve
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: routing/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  routing-pre:
    name: Routing pre-deployment
    needs: routing-post
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: routing/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  # -------------------------------------------------------------------- ecs
  ecs-post:
    name: ECS post-deployment
    needs: routing-pre
    if: inputs.stack == 'ecs' || inputs.stack == 'all'
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  ecs-sa-east-1:
    name: ECS sa-east-1
    needs: ecs-post
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/deployment
      backend-config: environment/sa-east-1/backend.tfvars
      var-file: environment/sa-east-1/terraform.tfvars
      apply: true
      destroy: true

  ecs-us-east-1:
    name: ECS us-east-1
    needs: ecs-sa-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/deployment
      backend-config: environment/us-east-1/backend.tfvars
      var-file: environment/us-east-1/terraform.tfvars
      apply: true
      destroy: true

  ecs-pre:
    name: ECS pre-deployment
    needs: ecs-us-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  # ---------------------------------------------------------------- network
  network-post:
    name: Network post-deployment (peering)
    needs: ecs-pre
    if: inputs.stack == 'all'
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  network-sa-east-1:
    name: Network sa-east-1
    needs: network-post
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/deployment
      backend-config: environment/sa-east-1/backend.tfvars
      var-file: environment/sa-east-1/terraform.tfvars
      apply: true
      destroy: true

  network-us-east-1:
    name: Network us-east-1
    needs: network-sa-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/deployment
      backend-config: environment/us-east-1/backend.tfvars
      var-file: environment/us-east-1/terraform.tfvars
      apply: true
      destroy: true

  network-pre:
    name: Network pre-deployment
    needs: network-us-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true
