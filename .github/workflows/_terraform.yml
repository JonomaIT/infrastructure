name: _terraform

# Internal use: runs init → validate → plan for one component and, if requested, applies that SAME saved plan.
# With destroy: true the plan is a destroy plan (-destroy); the apply still uses the saved plan.
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: true
        description: Terraform component directory (e.g. network/deployment)
      backend-config:
        type: string
        required: true
        description: Backend config file, relative to the component
      var-file:
        type: string
        required: true
        description: Variables file, relative to the component
      apply:
        type: boolean
        default: false
        description: Apply the plan generated in this job
      destroy:
        type: boolean
        default: false
        description: Generate a destroy plan (used only by destroy.yml)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
        description: Cloudflare API token (Zone:Read + DNS:Edit), only for components that manage Cloudflare records. Callers map it from the CLOUDFLARE_API_TOKEN_JONOMA repo secret

jobs:
  terraform:
    name: ${{ inputs.destroy && 'Destroy' || (inputs.apply && 'Plan + apply' || 'Plan') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Empty unless the caller passes it: only components with Cloudflare resources get the token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # No access keys: GitHub issues an OIDC token and AWS exchanges it for temporary credentials.
      # Role found by naming convention: github-actions-<repo> (created by the bootstrap component).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.event.repository.name }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -backend-config=${{ inputs.backend-config }}

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan ${{ inputs.destroy && '-destroy' || '' }} -var-file=${{ inputs.var-file }} -out=tfplan

      - name: Plan summary
        run: |
          {
            echo "### ${{ inputs.working-directory }} (${{ inputs.var-file }})"
            echo '```'
            terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' || echo "No changes."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Applies exactly the plan reviewed above; if the state changed in between, Terraform refuses it.
      - name: Terraform apply
        if: inputs.apply
        run: terraform apply tfplan
