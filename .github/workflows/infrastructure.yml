name: Infrastructure

# Stacks, in dependency order (each one reads the previous one through SSM):
#   network: pre → us-east-1 → sa-east-1 → post (peering)
#   ecs:     pre → us-east-1 → sa-east-1 → post
#   routing: pre → post (Global Accelerator in front of both regions)
#
# PR:     plan only, and only for the affected stacks plus everything downstream of them
#         (network → ecs → routing).
# main:   plan + apply of ALL stacks. Guarantees that AWS converges to what is in Git, even if a
#         previous run was cancelled in the queue. Unchanged stacks just report "No changes".
# Manual: pick the stack.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        description: Stack to start from (downstream stacks always run too - all = network → ecs → routing)
        options:
          - all
          - ecs
          - routing
        default: all

permissions:
  contents: read
  id-token: write # required for OIDC with AWS

# Never two runs touching the same states; an apply is never interrupted halfway.
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      network: ${{ steps.detect.outputs.network }}
      ecs: ${{ steps.detect.outputs.ecs }}
      routing: ${{ steps.detect.outputs.routing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect affected stacks
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          STACK: ${{ inputs.stack }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          network=false
          ecs=false
          routing=false

          # Each stack also triggers everything downstream: network → ecs → routing.
          case "$EVENT" in
            push)
              network=true; ecs=true; routing=true ;;
            workflow_dispatch)
              case "$STACK" in
                all)     network=true; ecs=true; routing=true ;;
                ecs)     ecs=true; routing=true ;;
                routing) routing=true ;;
              esac
              ;;
            pull_request)
              files=$(git diff --name-only "$BASE...$HEAD")
              echo "Changed files:"; echo "$files"
              if echo "$files" | grep -qE '^\.github/workflows/(infrastructure|_terraform)\.yml$'; then
                network=true; ecs=true; routing=true
              fi
              if echo "$files" | grep -q '^network/'; then network=true; ecs=true; routing=true; fi
              if echo "$files" | grep -q '^ecs/'; then ecs=true; routing=true; fi
              if echo "$files" | grep -q '^routing/'; then routing=true; fi
              ;;
          esac

          {
            echo "network=$network"
            echo "ecs=$ecs"
            echo "routing=$routing"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Stacks"
            echo "| Stack | Runs |"
            echo "|---|---|"
            echo "| network | $network |"
            echo "| ecs | $ecs |"
            echo "| routing | $routing |"
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  # ---------------------------------------------------------------- network
  network-pre:
    name: Network pre-deployment
    needs: [changes, fmt]
    if: needs.changes.outputs.network == 'true'
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  network-us-east-1:
    name: Network us-east-1
    needs: [changes, network-pre]
    if: needs.changes.outputs.network == 'true'
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/deployment
      backend-config: environment/us-east-1/backend.tfvars
      var-file: environment/us-east-1/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  network-sa-east-1:
    name: Network sa-east-1
    needs: [changes, network-us-east-1]
    if: needs.changes.outputs.network == 'true'
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/deployment
      backend-config: environment/sa-east-1/backend.tfvars
      var-file: environment/sa-east-1/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  network-post:
    name: Network post-deployment (peering)
    needs: [changes, network-sa-east-1]
    if: needs.changes.outputs.network == 'true'
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  # -------------------------------------------------------------------- ecs
  # Depends on every network job: runs if network succeeded OR did not need to run (skipped).
  ecs-pre:
    name: ECS pre-deployment
    needs: [changes, fmt, network-pre, network-us-east-1, network-sa-east-1, network-post]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.ecs == 'true' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_JONOMA }}

  ecs-us-east-1:
    name: ECS us-east-1
    needs: [changes, ecs-pre]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.ecs == 'true' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/deployment
      backend-config: environment/us-east-1/backend.tfvars
      var-file: environment/us-east-1/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  ecs-sa-east-1:
    name: ECS sa-east-1
    needs: [changes, ecs-us-east-1]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.ecs == 'true' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/deployment
      backend-config: environment/sa-east-1/backend.tfvars
      var-file: environment/sa-east-1/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  ecs-post:
    name: ECS post-deployment
    needs: [changes, ecs-sa-east-1]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.ecs == 'true' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  # ---------------------------------------------------------------- routing
  # Depends on every network and ecs job: runs if they succeeded OR did not need to run (skipped).
  routing-pre:
    name: Routing pre-deployment
    needs: [changes, fmt, network-pre, network-us-east-1, network-sa-east-1, network-post, ecs-pre, ecs-us-east-1, ecs-sa-east-1, ecs-post]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.routing == 'true' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: routing/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_JONOMA }}

  routing-post:
    name: Routing post-deployment (Global Accelerator)
    needs: [changes, routing-pre]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.routing == 'true' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: routing/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_JONOMA }}
