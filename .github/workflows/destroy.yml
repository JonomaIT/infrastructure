name: Destroy

# Destrói o lab. Só manual, com confirmação digitada e aprovação do Environment "destroy".
# Ordem inversa da criação: ecs antes da network (load balancers e VPC Link ficam nas subnets),
# e dentro de cada stack: post → sa-east-1 → us-east-1 → pre.
# Para subir de novo: Run workflow no "Infrastructure".
on:
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        description: "O que destruir: ecs (só o cluster) ou all (cluster e rede)"
        options:
          - ecs
          - all
        default: ecs
      confirm:
        type: string
        required: true
        description: Digite "destroy" para confirmar

permissions:
  contents: read
  id-token: write # necessário para o OIDC com a AWS

# Mesmo grupo do Infrastructure: nunca destrói enquanto um apply roda (e vice-versa).
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  check:
    name: Check confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate input and branch
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Confirmação inválida. Digite exatamente: destroy"
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Destroy só roda a partir da main (recebido: $REF)"
            exit 1
          fi

  approve:
    name: Approve destroy (${{ inputs.stack }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: destroy # required reviewers: o job espera aprovação antes de rodar
    steps:
      - name: Approved
        run: echo "Destroy de '${{ inputs.stack }}' aprovado por ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------- ecs
  ecs-post:
    name: ECS post-deployment
    needs: approve
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  ecs-sa-east-1:
    name: ECS sa-east-1
    needs: ecs-post
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/deployment
      backend-config: environment/sa-east-1/backend.tfvars
      var-file: environment/sa-east-1/terraform.tfvars
      apply: true
      destroy: true

  ecs-us-east-1:
    name: ECS us-east-1
    needs: ecs-sa-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/deployment
      backend-config: environment/us-east-1/backend.tfvars
      var-file: environment/us-east-1/terraform.tfvars
      apply: true
      destroy: true

  ecs-pre:
    name: ECS pre-deployment
    needs: ecs-us-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: ecs/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  # ---------------------------------------------------------------- network
  network-post:
    name: Network post-deployment (peering)
    needs: ecs-pre
    if: inputs.stack == 'all'
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true

  network-sa-east-1:
    name: Network sa-east-1
    needs: network-post
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/deployment
      backend-config: environment/sa-east-1/backend.tfvars
      var-file: environment/sa-east-1/terraform.tfvars
      apply: true
      destroy: true

  network-us-east-1:
    name: Network us-east-1
    needs: network-sa-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/deployment
      backend-config: environment/us-east-1/backend.tfvars
      var-file: environment/us-east-1/terraform.tfvars
      apply: true
      destroy: true

  network-pre:
    name: Network pre-deployment
    needs: network-us-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: network/pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: true
      destroy: true
