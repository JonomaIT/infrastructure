name: Multiregion

# PR: só plan em todos os componentes. Merge na main (ou disparo manual): plan + apply, em ordem.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessário para o OIDC com a AWS

# Nunca dois runs mexendo no mesmo state; um apply nunca é interrompido no meio.
concurrency:
  group: terraform-multiregion
  cancel-in-progress: false

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  pre-deployment:
    name: Pre-deployment
    needs: fmt
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: pre-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  us-east-1:
    name: Deployment us-east-1
    needs: pre-deployment
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: deployment
      backend-config: environment/us-east-1/backend.tfvars
      var-file: environment/us-east-1/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  sa-east-1:
    name: Deployment sa-east-1
    needs: us-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: deployment
      backend-config: environment/sa-east-1/backend.tfvars
      var-file: environment/sa-east-1/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}

  post-deployment:
    name: Post-deployment (peering)
    needs: sa-east-1
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: post-deployment
      backend-config: environment/backend.tfvars
      var-file: environment/terraform.tfvars
      apply: ${{ github.event_name != 'pull_request' }}
